<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Admin Portal - Campus Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #f0f0f0;
            padding: 12px 15px;
            font-size: 16px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .demo-creds {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #6c757d;
        }
        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .dashboard-preview {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <h2><i class="fas fa-graduation-cap"></i> Campus Events</h2>
                <p class="mb-0">Admin Portal</p>
            </div>
            
            <div class="login-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" value="admin_nit" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" value="admin123" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login">
                        <i class="fas fa-sign-in-alt me-2"></i>Login to Dashboard
                    </button>
                </form>
                
                <div class="status-message" id="statusMessage"></div>
                
                <div class="demo-creds">
                    <strong>Demo Credentials:</strong><br>
                    • admin_nit / admin123<br>
                    • admin_iit / admin123
                </div>
                
                <div class="dashboard-preview" id="dashboardPreview">
                    <h5>Dashboard Preview</h5>
                    <div class="row">
                        <div class="col-4">
                            <div class="stat-card">
                                <div class="stat-number" id="previewEvents">1</div>
                                <div class="stat-label">Events</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-card">
                                <div class="stat-number" id="previewStudents">3</div>
                                <div class="stat-label">Students</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-card">
                                <div class="stat-number" id="previewRegistrations">3</div>
                                <div class="stat-label">Registrations</div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-success" onclick="goToFullDashboard()">
                            <i class="fas fa-tachometer-alt me-2"></i>Go to Full Dashboard
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const statusMessage = document.getElementById('statusMessage');
            const dashboardPreview = document.getElementById('dashboardPreview');
            
            // Show loading
            statusMessage.className = 'status-message';
            statusMessage.textContent = 'Logging in...';
            statusMessage.style.display = 'block';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    // Store credentials
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('current_admin', JSON.stringify(data.user));
                    
                    // Show success
                    statusMessage.className = 'status-message status-success';
                    statusMessage.innerHTML = '<i class="fas fa-check-circle me-2"></i>Login successful! Welcome, ' + data.user.fullName;
                    
                    // Load preview stats
                    loadPreviewStats(data.token);
                    
                    // Show dashboard preview
                    setTimeout(() => {
                        dashboardPreview.style.display = 'block';
                    }, 1000);
                    
                } else {
                    statusMessage.className = 'status-message status-error';
                    statusMessage.innerHTML = '<i class="fas fa-exclamation-circle me-2"></i>' + (data.message || 'Login failed');
                }
            } catch (error) {
                statusMessage.className = 'status-message status-error';
                statusMessage.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>Network error: ' + error.message;
            }
        });
        
        async function loadPreviewStats(token) {
            try {
                const responses = await Promise.all([
                    fetch('/api/events', { headers: { 'Authorization': 'Bearer ' + token } }),
                    fetch('/api/students', { headers: { 'Authorization': 'Bearer ' + token } }),
                    fetch('/api/registrations', { headers: { 'Authorization': 'Bearer ' + token } })
                ]);
                
                const [events, students, registrations] = await Promise.all([
                    responses[0].json(),
                    responses[1].json(),
                    responses[2].json()
                ]);
                
                document.getElementById('previewEvents').textContent = Array.isArray(events) ? events.length : 0;
                document.getElementById('previewStudents').textContent = Array.isArray(students) ? students.length : 0;
                document.getElementById('previewRegistrations').textContent = Array.isArray(registrations) ? registrations.length : 0;
                
            } catch (error) {
                console.error('Error loading preview stats:', error);
            }
        }
        
        function goToFullDashboard() {
            window.location.href = '/admin.html';
        }
        
        // Check if already logged in
        window.addEventListener('load', function() {
            const token = localStorage.getItem('admin_token');
            const admin = localStorage.getItem('current_admin');
            
            if (token && admin) {
                const adminData = JSON.parse(admin);
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.className = 'status-message status-success';
                statusMessage.innerHTML = '<i class="fas fa-user-check me-2"></i>Already logged in as ' + adminData.fullName;
                statusMessage.style.display = 'block';
                
                loadPreviewStats(token);
                document.getElementById('dashboardPreview').style.display = 'block';
            }
        });
    </script>
</body>
</html>
